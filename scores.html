<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live scores, schedules and finals across the six TFI leagues.">
  <title>Live Scores | The Favorite Index</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./scoreboard.mjs"></script>
  <style>
    .score-page { position: relative; isolation: isolate; min-height: 100vh; background: #090c09; color: #f4f7f0; }
    .score-page::before {
      content: ''; position: fixed; inset: -16px; z-index: -1; pointer-events: none;
      background:
        linear-gradient(180deg, #090c0950 0%, #090c09aa 38%, #090c09 88%),
        radial-gradient(ellipse at 50% 26%, #090c09e8 0%, #090c0930 80%),
        url('./tfi-banner.webp') center top / cover no-repeat;
      filter: blur(7px);
    }
    .score-page::after {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse at 0% 0%, #aaff1426 0%, transparent 48%),
        radial-gradient(ellipse at 100% 0%, #aaff1426 0%, transparent 48%);
    }
    .score-page .scoreboard { padding-block: 28px 48px; }
    .score-hero {
      position: relative; isolation: isolate; overflow: hidden;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: clamp(22px, 4vw, 52px); border: 1px solid #354329; border-radius: 10px;
      background: radial-gradient(ellipse at 100% 0, #30471bc9 0%, transparent 68%), #10160fe6;
    }
    .score-hero::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: repeating-linear-gradient(116deg, transparent 0 32px, #aaff1410 33px 34px);
    }
    .score-title { margin: 6px 0 12px; color: #fff; font: 900 clamp(38px, 7vw, 96px)/.94 TFIHeavy, Arial, sans-serif; text-transform: uppercase; }
    .score-kicker { color: #baff19; font: 800 12px/1.2 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    .score-hero img { width: clamp(72px, 15vw, 172px); height: auto; }
    .scoreboard-meta { margin: 0; color: #bfcbb8; font: 500 13px/1.5 Arial, sans-serif; }
    .scoreboard-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-block: 20px; }
    .scoreboard-controls label { display: flex; align-items: center; gap: 12px; }
    .scoreboard select { background: #151c14; color: #fff; border: 1px solid #627655; border-radius: 5px; padding: 8px 12px; font: inherit; }
    .scoreboard-group { margin-block: 24px; }
    .scoreboard-group h2 { display: flex; align-items: center; gap: 12px; font: 900 clamp(23px, 3vw, 37px)/1 TFIHeavy, Arial, sans-serif; text-transform: uppercase; margin: 0 0 12px; }
    .scoreboard-group h2::after { content: ''; flex: 1; border-top: 1px solid #364530; }
    .scoreboard-grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 262px), 1fr)); gap: 12px; }
    .scoreboard-game { overflow: hidden; background: linear-gradient(140deg, #182117, #101610); border: 1px solid #344032; border-radius: 7px; }
    .scoreboard-game[data-state="in"] { border-color: #637f35; }
    .score-game-status {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 14px; background: #0c120c; border-bottom: 1px solid #344032;
      color: #c4d0bd; font: 700 12px/1.25 Arial, sans-serif;
    }
    .score-game-status b { color: #e5f0df; letter-spacing: .08em; }
    .score-game-status span { text-align: right; }
    [data-state="in"] .score-game-status span { color: #baff19; }
    .scoreboard-team { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 47px; padding: 7px 14px; font: 700 15px/1.15 Arial, sans-serif; }
    .scoreboard-team + .scoreboard-team { border-top: 1px solid #354031; }
    .score-team-name { overflow-wrap: anywhere; }
    .score-team-tag { min-width: 34px; padding: 4px; border-radius: 3px; background: #273223; color: #c5d4bd; text-align: center; font-size: 10px; }
    .scoreboard-team strong { font: 900 28px/1 Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .scoreboard-group > p { margin: 0; padding: 16px; border: 1px solid #344032; border-radius: 6px; color: #c4d0bd; }
    .score-footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid #344032; }
    .score-broadcast .score-coverage, .score-broadcast .site-header, .score-broadcast .scoreboard-controls { display: none; }
    .score-broadcast .scoreboard { width: 100%; max-width: none; padding: 3vh 4vw; }
    .score-broadcast .score-hero { padding: clamp(12px, 1.4vh, 22px) 2vw; }
    .score-broadcast .score-hero img { display: none; }
    .score-broadcast .scoreboard-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1vw; }
    .score-broadcast .scoreboard-team { padding: 1vh 1vw; font-size: clamp(12px, 2.45vh, 35px); }
    .score-broadcast .scoreboard-team strong { font-size: clamp(22px, 5vh, 68px); }
    .score-broadcast .score-team-tag { font-size: clamp(9px, 1.5vh, 22px); }
    .score-broadcast .score-game-status { padding: 1vh 1vw; font-size: clamp(11px, 1.8vh, 25px); }
    .score-broadcast #scoreboard-status { margin-top: 10px; }
    .score-broadcast .score-footer { margin-top: 14px; font-size: clamp(12px, 1.8vh, 24px); color: #baff19; }
    @media (min-width: 701px) and (min-aspect-ratio: 4/3) {
      .score-broadcast .scoreboard {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        box-sizing: border-box;
      }
      .score-broadcast .score-hero > div {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 2vw;
        width: 100%;
      }
      .score-broadcast .score-hero .scoreboard-meta {
        grid-column: 2;
        grid-row: 1 / span 2;
        text-align: right;
      }
      .score-broadcast #scoreboard-games { min-width: 0; }
      .score-broadcast .scoreboard-group { margin-block: clamp(12px, 2vh, 24px); min-width: 0; }
      .score-broadcast .scoreboard-grid {
        --team-size: clamp(14px, 2.6vh, 38px);
        --score-size: clamp(24px, 5.6vh, 80px);
        --clock-size: clamp(12px, 2vh, 28px);
        --row-height: clamp(47px, 9vh, 115px);
        gap: clamp(12px, 1.4vw, 30px);
      }
      .score-broadcast .scoreboard-grid:not(:has(> :nth-child(4))) {
        --score-size: clamp(32px, 7vh, 92px);
        --row-height: clamp(55px, 12vh, 150px);
      }
      .score-broadcast .scoreboard-grid:not(:has(> :nth-child(3))) {
        --team-size: clamp(18px, 3.5vh, 52px);
        --score-size: clamp(36px, 8.4vh, 110px);
        --clock-size: clamp(14px, 2.65vh, 38px);
        --row-height: clamp(58px, 13vh, 160px);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .score-broadcast .scoreboard-grid:has(> :nth-child(4):last-child) {
        --row-height: clamp(50px, 11vh, 130px);
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .score-broadcast .scoreboard-grid:has(> :only-child) {
        grid-template-columns: minmax(0, 1fr);
        max-width: min(76%, 1320px);
        margin-inline: auto;
      }
      .score-broadcast .scoreboard-game[data-state="in"] {
        border-color: #92c93e;
        box-shadow: inset 0 0 0 1px #baff1920, 0 8px 24px #0006;
      }
      .score-broadcast .scoreboard-team {
        min-height: var(--row-height);
        font-size: var(--team-size);
      }
      .score-broadcast .scoreboard-team strong { font-size: var(--score-size); }
      .score-broadcast .score-game-status { font-size: var(--clock-size); }
      .score-broadcast .score-footer { margin-top: auto; }
    }
    @media (max-width: 700px) {
      .scoreboard-team { font-size: 14px; }
      .score-broadcast .scoreboard-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* OBS uses a separate palette from the website scoreboard. */
    .score-page.score-broadcast {
      --broadcast-cyan: #64f6ff;
      --broadcast-pink: #ff61bb;
      --broadcast-violet: #ab90fe;
      --broadcast-muted: #c6bfd9;
      --broadcast-line: #393255;
      background: #080715;
    }
    .score-broadcast.score-page::before {
      background:
        linear-gradient(180deg, #080715c9, #080715e8 42%, #080715 92%),
        url('./tfi-banner.webp') center top / cover no-repeat;
    }
    .score-broadcast.score-page::after {
      background:
        radial-gradient(ellipse at 0% 10%, #087d9b48, transparent 54%),
        radial-gradient(ellipse at 100% 9%, #ae227c53, transparent 53%),
        radial-gradient(ellipse at 50% 108%, #482b8d60, transparent 58%);
    }
    .score-broadcast .score-hero {
      border-color: var(--broadcast-line);
      background: linear-gradient(112deg, #102839, #16142b 48%, #361832);
      box-shadow: 0 12px 30px #0005;
    }
    .score-broadcast .score-hero::before {
      background: repeating-linear-gradient(118deg, transparent 0 30px, #d8c7ff14 31px 32px);
      mask-image: linear-gradient(90deg, transparent 12%, #000 62%);
    }
    .score-broadcast .score-hero::after {
      content: ''; position: absolute; inset: 0 0 auto; height: 3px; pointer-events: none;
      background: linear-gradient(90deg, var(--broadcast-cyan), var(--broadcast-violet) 49%, var(--broadcast-pink));
    }
    .score-broadcast .score-kicker { color: var(--broadcast-cyan); }
    .score-broadcast .scoreboard-meta { color: var(--broadcast-muted); }
    .score-broadcast .scoreboard-group h2::after {
      height: 1px; border: 0;
      background: linear-gradient(90deg, #64f6ff90, #ab90fe60 50%, #ff61bb72);
    }
    .score-broadcast .scoreboard-game {
      background: linear-gradient(125deg, #17182f, #100f23 70%, #21142b);
      border-color: var(--broadcast-line);
      box-shadow: 0 8px 22px #0005;
    }
    .score-broadcast .scoreboard-game[data-state="in"] {
      border-color: #55c7e0;
      box-shadow: inset 0 0 0 1px #64f6ff22, 0 0 19px #64f6ff22, 0 8px 22px #0005;
    }
    @supports (clip-path: polygon(0 0, 100% 0, 0 100%)) {
      .score-broadcast .scoreboard-game {
        --corner-cut: 13px;
        position: relative;
        isolation: isolate;
        border: 1px solid transparent;
        border-radius: 0;
        background: linear-gradient(125deg, #65829d, #524776 40%, #774a79) border-box;
        clip-path: polygon(
          0 0, calc(100% - var(--corner-cut)) 0, 100% var(--corner-cut),
          100% 100%, var(--corner-cut) 100%, 0 calc(100% - var(--corner-cut))
        );
      }
      .score-broadcast .scoreboard-game::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(125deg, #17182f, #100f23 70%, #21142b);
        clip-path: polygon(
          0 0, calc(100% - var(--corner-cut) + 1px) 0, 100% calc(var(--corner-cut) - 1px),
          100% 100%, calc(var(--corner-cut) - 1px) 100%, 0 calc(100% - var(--corner-cut) + 1px)
        );
      }
      .score-broadcast .scoreboard-game[data-state="in"] {
        border-color: transparent;
        background: linear-gradient(125deg, var(--broadcast-cyan), #5488b8 44%, var(--broadcast-pink)) border-box;
      }
      .score-broadcast .score-game-status {
        /* Keep the top-right frame visible through the status strip. */
        clip-path: polygon(0 0, calc(100% - var(--corner-cut) + 1px) 0, 100% calc(var(--corner-cut) - 1px), 100% 100%, 0 100%);
      }
    }
    .score-broadcast .score-game-status {
      background: #101026;
      border-color: var(--broadcast-line);
      color: var(--broadcast-muted);
    }
    .score-broadcast .score-game-status b { color: #efddff; }
    .score-broadcast [data-state="in"] .score-game-status span { color: var(--broadcast-cyan); }
    .score-broadcast .scoreboard-team + .scoreboard-team { border-color: var(--broadcast-line); }
    .score-broadcast .score-team-tag { background: #32254b; color: #e7dafe; }
    .score-broadcast .scoreboard-team strong { color: #fff; }
    .score-broadcast .scoreboard-group > p { border-color: var(--broadcast-line); color: var(--broadcast-muted); }
    .score-broadcast .score-footer { border-color: var(--broadcast-line); }
    .score-broadcast .score-footer strong { color: var(--broadcast-cyan); }

    .score-broadcast {
      --broadcast-display-font: 'Chakra Petch', 'Trebuchet MS', Arial, sans-serif;
    }
    .score-broadcast .score-title,
    .score-broadcast .scoreboard-group h2,
    .score-broadcast .score-kicker,
    .score-broadcast .score-game-status,
    .score-broadcast .scoreboard-team strong {
      font-family: var(--broadcast-display-font);
      font-weight: 700;
    }
    .score-broadcast .score-title {
      margin: 4px 0 2px;
      font-size: clamp(26px, min(6vh, 8vw), 88px);
      line-height: 1;
      letter-spacing: .025em;
    }
    .score-broadcast .scoreboard-group h2 { letter-spacing: .04em; }
    .score-broadcast .score-game-status { font-variant-numeric: tabular-nums; }

    .score-broadcast .score-headlines:not([hidden]) {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      margin-bottom: clamp(8px, 1.4vh, 16px);
      border: 1px solid var(--broadcast-line);
      border-inline-start: 2px solid var(--broadcast-pink);
      background: #101026;
      color: #f4f7f0;
      font-size: clamp(13px, 1.9vh, 22px);
    }
    .score-headlines-label, .score-headlines button {
      padding: .65em .8em;
      font: 700 .85em/1.2 var(--broadcast-display-font);
    }
    .score-headlines-label { color: var(--broadcast-cyan); }
    .score-headlines-window { overflow: hidden; }
    .score-headlines-track { display: flex; width: max-content; }
    .score-headlines-track:has(> :nth-child(2)) {
      animation: score-headlines-scroll var(--headlines-duration, 55s) linear infinite;
    }
    .score-headlines-strip {
      display: flex; align-items: center; gap: 2em; flex: 0 0 auto;
      list-style: none; padding: .55em 2em .55em 0; margin: 0;
    }
    .score-headlines-strip li { white-space: nowrap; }
    .score-headlines-strip b { color: var(--broadcast-violet); margin-inline-end: .6em; }
    .score-headlines button {
      border: 0; border-inline-start: 1px solid var(--broadcast-line);
      color: var(--broadcast-muted); background: transparent; cursor: pointer;
    }
    .score-headlines.is-paused .score-headlines-track { animation-play-state: paused; }
    .score-headlines-window:has(.score-headlines-strip:only-child) { overflow: auto; }
    .score-headlines:has(.score-headlines-strip:only-child) button { visibility: hidden; }
    @keyframes score-headlines-scroll { to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      .score-headlines-track:has(> :nth-child(2)) { animation: none; }
      .score-headlines-window { overflow: auto; }
      .score-headlines-strip[aria-hidden="true"], .score-headlines button { display: none; }
    }
  </style>
</head>
