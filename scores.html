<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live scores, schedules and finals across the six TFI leagues.">
  <title>Live Scores | The Favorite Index</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./scoreboard.mjs"></script>
  <style>
    .scoreboard { padding-block: clamp(24px, 6vw, 72px); }
    .scoreboard h1 { font-size: clamp(40px, 8vw, 88px); margin: 16px 0; }
    .scoreboard-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; margin-block: 24px; }
    .scoreboard-controls label { display: grid; gap: 8px; }
    .scoreboard select { background: #161b14; color: #fff; border: 1px solid #66745b; border-radius: 4px; padding: 10px; font: inherit; }
    .scoreboard-meta { color: #becab5; line-height: 1.6; }
    .scoreboard-group { margin-block: 32px; }
    .scoreboard-group h2 { font-size: clamp(24px, 4vw, 38px); margin-bottom: 16px; }
    .scoreboard-grid { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
    .scoreboard-game { padding: 16px; background: #161b14; border: 1px solid #394629; border-radius: 6px; }
    .scoreboard-game p { margin: 0 0 12px; font-size: 13px; color: #becab5; }
    .scoreboard-game[data-state="in"] p { color: var(--lime); }
    .scoreboard-team { display: flex; justify-content: space-between; gap: 12px; padding-block: 5px; overflow-wrap: anywhere; }
    .scoreboard-team strong { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="wrap header">
    <a class="brand" href="./" aria-label="The Favorite Index home">
      <span class="original-logo"><img src="./tfi-logo.webp" alt="" width="100" height="100"></span>
      <span>THE FAVORITE<br>INDEX<span class="green">.</span></span>
    </a>
    <a href="./#picks">Free picks</a>
  </header>
  <main id="main" class="wrap scoreboard" tabindex="-1">
    <h1>Live Scores</h1>
    <p class="scoreboard-meta"><time id="scoreboard-date"></time> · Central Time · Scores via ESPN · Refreshes every 10 seconds</p>
    <p class="scoreboard-meta">College coverage includes FBS football and Division I men’s basketball.</p>
    <div class="scoreboard-controls">
      <label>League <select id="scoreboard-league" disabled><option value="">All leagues</option></select></label>
    </div>
    <p id="scoreboard-status" class="scoreboard-meta" role="status">Loading scores…</p>
    <div id="scoreboard-games"></div>
    <noscript>Enable JavaScript to see scores.</noscript>
  </main>
</body>
</html>
